# ReconLogic — Docker Compose stack (PostgreSQL + Redis + FastAPI)
# Requires .env from .env.example (fill with real keys)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reconlogic
      POSTGRES_PASSWORD: ${DB_PASSWORD:-reconlogic}
      POSTGRES_DB: reconlogic
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../server
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://reconlogic:${DB_PASSWORD:-reconlogic}@postgres:5432/reconlogic
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL}
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
